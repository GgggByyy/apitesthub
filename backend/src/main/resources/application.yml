server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/apitesthub?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    # 凭证不入库：优先读环境变量 DB_USERNAME / DB_PASSWORD，
    # 本地开发复制 application-local.yml.example 为 application-local.yml 填写（.gitignore 已排除）
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  # 演示密钥（>=256bit），生产环境用环境变量 JWT_SECRET 覆盖
  secret: ${JWT_SECRET:ApitestHubDemoSecretKey2026ForJwtTokenGenerationOnly}
